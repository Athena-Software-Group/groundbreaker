[project]
name = "aegis"
version = "0.9.0b0"
description = "Aegis (GroundBreaker), powered by Athena Software Group, Inc.: on-chain fund-flow tracer and stop-order generator for crypto fraud response"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Athena Software Group, Inc." }]
maintainers = [{ name = "Athena Software Group, Inc." }]
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3", "Programming Language :: Python :: 3"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "networkx>=3.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "pypdf==6.21.4",
    "markdown-it-py>=3.0",
    "itsdangerous>=2.1",
    "anthropic>=1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's Depends() in defaults is the framework idiom
ignore = ["B008", "FURB162", "SIM102", "PIE810"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
